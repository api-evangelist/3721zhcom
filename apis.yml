aid: 3721zhcom
name: 3721zh.com
description: >-
  3721zh.com is the public domain of 转换商城 (Zhuanhuan Mall / "Conversion Mall"), the local-life
  private-domain e-commerce platform operated by 转换空间（上海）电子商务有限公司 (Zhuanhuan Space
  (Shanghai) E-Commerce Co., Ltd.), founded in 2018 and headquartered in Shanghai, China. It bundles
  a free-to-merchant SaaS with a branded-goods supply chain, fulfilment, and private-domain traffic
  build-out and agency operation, so catering, property-management, beauty, hotel, foot-bath,
  tea-house, education and retail-chain merchants can turn in-store spend into equivalent-value
  goods, vouchers, coupons and memberships. Company materials list WeCom, WeCom communities, WeChat
  mini programs, API interfaces and private deployment as the delivery modes of that service system.
  As of the 2026-09-05 probe the company publishes no developer portal, API reference or
  machine-readable contract; integration is arranged through its onboarding forms and a sales
  conversation.
